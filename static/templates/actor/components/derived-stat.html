<div data-stat="{{statName}}" class="attribute-container">
  <div class="attribute">
    <p name="{{stat.derivedName}}" class="modifiable">
      {{ stat.derivedValue }}
    </p>
    <div>
      <span>
        +
      </span>
      <input placeholder="0" type="text" name="data.attributes.{{statName}}.mod" class="modifier"
        value="{{modifierValue}}" />
    </div>
  </div>
  <p class="attribute-label">
    {{localize stat.label}}
  </p>
</div>
