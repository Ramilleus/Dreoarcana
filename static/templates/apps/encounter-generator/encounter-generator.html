<div class="content-box">
  <section class="content">
    <div class="template-list-container">
      <div class="template-list-headers">
        <div>Enemy Type</div>
        <div>Race</div>
        <div>Rank</div>
        <div>Owner</div>
      </div>
      <div class="template-list">
        {{#each templates as |template|}}
        <div class="template-list-row">
          <div>{{ template.name }}</div>
          <div>{{ template.race }}</div>
          <div>{{ template.rank }}</div>
          <div>{{ template.owner }}</div>
        </div>
        {{/each}}
      </div>
    </div>
  </section>
</div>
