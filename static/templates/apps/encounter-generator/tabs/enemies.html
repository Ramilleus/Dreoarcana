<div class="tab enemies" data-group="primary" data-tab="enemies">
  <div class="d-flex d-flex--column height-100">
    <section class="enemy-template-list-filters template-list-filters flex-0">
      <input type="text" data-dtype="String" class="template-list-search" name="enemySearchTerm"
        value="{{ filters.enemy.search.text }}" />
      <button class="search-button">Search</button>
    </section>
    <section class="template-list-section flex-1">
      <div class="template-list-header-row">
        <div class="enemy-type">Enemy Type</div>
        <div>Race</div>
        <div>Rank</div>
        <div>Owner</div>
        <div></div>
      </div>
      <div class="template-list-rows enemy-template-list-rows">
        {{#each enemyTemplates as |template|}}
        <div data-template-id="{{ template.id }}" data-template-type="enemy" class="template-list-row">
          <div class="enemy-type">{{ template.name }}</div>
          <div>{{ template.race }}</div>
          <div>{{ template.rank }}</div>
          <div>{{ template.owner }}</div>
          <div><button class="import-button">Import ></button></div>
        </div>
        {{/each}}
        {{#if showEnemyLoader}}
        <div class="loader-row">
          {{> systems/mythras/templates/common-components/loader.html}}
        </div>
        {{/if}}

      </div>
    </section>
  </div>
</div>
