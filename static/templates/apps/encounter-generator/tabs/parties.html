<div class="tab parties" data-group="primary" data-tab="parties">
  <div class="d-flex d-flex--column height-100">
    <section class="party-template-list-filters template-list-filters flex-0">
      <input type="text" data-dtype="String" class="template-list-search" name="partySearchTerm"
        value="{{ filters.party.search.text }}" />
      <button class="search-button">Search</button>
    </section>
    <section class="template-list-section flex-1">
      <div class="template-list-header-row">
        <div class="party-type">Party Type</div>
        <div>Owner</div>
        <div></div>
      </div>
      <div class="template-list-rows party-template-list-rows">
        {{#each partyTemplates as |template|}}
        <div data-template-id="{{ template.id }}" data-template-type="party" class="template-list-row">
          <div class="party-type">{{ template.name }}</div>
          <div>{{ template.owner }}</div>
          <div><button class="import-button">Import ></button></div>
        </div>
        {{/each}}
        {{#if showPartyLoader}}
        <div class="loader-row">
          {{> systems/mythras/templates/common-components/loader.html}}
        </div>
        {{/if}}

      </div>
    </section>
  </div>
</div>
