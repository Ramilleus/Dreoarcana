<form class="{{cssClass}}" autocomplete="off">
  <header class="sheet-header">
    <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}"/>
    <div class="header-fields">
      <h1 class="charname"><input name="name" type="text" value="{{item.name}}" placeholder="Name"/></h1>
      <div class="grid grid-2col">
        <div class="resource">
          <label class="resource-label">Base Characteristic 1</label>
          <select name="data.primaryChar" data-dtype="String">
            {{#select data.primaryChar}}
            <option value="str">Strength</option>
            <option value="con">Constitution</option>
            <option value="siz">Size</option>
            <option value="dex">Dexterity</option>
            <option value="int">Intelligence</option>
            <option value="pow">Power</option>
            <option value="cha">Charisma</option>
            {{/select}}
          </select>
        </div>
        <div class="resource">
          <label class="resource-label">Base Characteristic 2</label>
          <select name="data.secondaryChar" data-dtype="String">
              {{#select data.secondaryChar}}
              <option value="str">Strength</option>
              <option value="con">Constitution</option>
              <option value="siz">Size</option>
              <option value="dex">Dexterity</option>
              <option value="int">Intelligence</option>
              <option value="pow">Power</option>
              <option value="cha">Charisma</option>
              {{/select}}
          </select>
        </div>
      </div>
    </div>
  </header>

  {{!-- Sheet Tab Navigation --}}
  <nav class="sheet-tabs tabs" data-group="primary">
    <a class="item" data-tab="description">Description</a>
    <a class="item" data-tab="attributes">Attributes</a>
  </nav>

  {{!-- Sheet Body --}}
  <section class="sheet-body">

    {{!-- Description Tab --}}
    <div class="tab" data-group="primary" data-tab="description">
      {{editor content=data.description target="data.description" button=true owner=owner editable=editable}}
    </div>

    {{!-- Attributes Tab --}}
    <div class="tab attributes" data-group="primary" data-tab="attributes">
      {{!-- As you add new fields, add them in here! --}}
    </div>
  </section>
</form>
