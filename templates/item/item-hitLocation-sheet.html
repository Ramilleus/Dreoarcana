<form class="{{cssClass}} hitLocation-sheet flexcol" autocomplete="off">
  <div>
    Name:
    <input name="name" type="text" value="{{item.name}}" placeholder="Name" />

    rollingRangeStart:
    <input type="number" name="data.rollingRangeStart" value="{{data.rollingRangeStart}}" />
    <br />
    rollingRangeEnd:
    <input type="number" name="data.rollingRangeEnd" value="{{data.rollingRangeEnd}}" />
    <br />
    maxHp:
    <input type="number" name="data.maxHp" value="{{data.maxHp}}" />
    <br />
    currentHp:
    <input type="number" name="data.currentHp" value="{{data.currentHp}}" />
    <br />
    maxHpMod:
    <input type="number" name="data.maxHpMod" value="{{data.maxHpMod}}" />
  </div>
</form>
