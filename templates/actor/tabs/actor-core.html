<div class="tab core" data-group="primary" data-tab="core">
  <div class="core-top-flex">
    <div class="core-personal-info">
        <h2>Character Information</h2>
        <div class="core-personal-flex">
          <div class="core-personal-left-info">
            <p class="input-label">CAREER</p>
            <input type="text" name="data.career" value="{{data.career}}"/>
            <p class="input-label">SOCIAL CLASS</p>
            <input type="text" name="data.socialClass" value="{{data.socialClass}}"/>
            <p class="input-label">GENDER</p>
            <input type="text" name="data.gender" value="{{data.gender}}"/>
          </div>
          <div class="core-personal-right-info">
            <p class="input-label">HOMELAND</p>
            <input type="text" name="data.homeland" value="{{data.homeland}}"/>
            <p class="input-label">CULTURE</p>
            <input type="text" name="data.raceCulture" value="{{data.raceCulture}}"/>
            <div class="age-height-weight-flex">
              <div class="age">
                <p class="input-label">AGE</p>
                <input type="text" name="data.age" value="{{data.age}}"/>
              </div>
              <div class="height">
                <p class="input-label">HEIGHT</p>
                <input type="text" name="data.height" value="{{data.height}}"/>
              </div>
              <div class="weight">
                <p class="input-label">WEIGHT</p>
                <input type="text" name="data.weight" value="{{data.weight}}"/>
              </div>
            </div>
            
          </div>
        </div>
    </div>
    <div class="core-characteristics-attributes-contianer">
        <div class="core-characteristics">
          <h2>Characteristics</h2>
        </div>
        <div class="core-attributes">
          <h2>Attributes</h2>
        </div>
    </div>

  </div>
  <div class="core-skills">
    <h2>Skills</h2>
  </div>
</div>
