name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set version and URLs in system.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg version "$VERSION" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/system.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/dreoarcana.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             system.json > system.tmp.json
          mv system.tmp.json system.json

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          cp system.json dist/system.json
          mv dist dreoarcana
          zip -r dreoarcana.zip dreoarcana

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dreoarcana/system.json dreoarcana.zip --clobber
